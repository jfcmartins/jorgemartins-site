<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Blue/green rollout: a new chart with Gateway API manifests and a new ALB, tested end to end, then the real DNS is switched."><rect x="0" y="0" width="720" height="290" rx="12" fill="#0f172a"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c58b"/></marker></defs><text x="360" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Blue/green rollout, one environment at a time</text><rect x="30" y="60" width="230" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="145" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">Old (blue)</text><image href="data:image/svg+xml;base64," x="130" y="98" width="30" height="30"/><text x="145" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">Ingress NGINX</text><text x="145" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Ingress resources</text><rect x="400" y="60" width="290" height="150" rx="10" fill="#0b2a22" stroke="#22c58b" stroke-width="2"/><text x="545" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#3fe3a6" text-anchor="middle">New (green)</text><image href="data:image/svg+xml;base64," x="428" y="100" width="30" height="30"/><image href="data:image/svg+xml;base64," x="480" y="100" width="30" height="30"/><image href="data:image/svg+xml;base64," x="532" y="100" width="30" height="30"/><text x="545" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d1fae5" text-anchor="middle">New chart with Gateway API manifests</text><text x="545" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#a7f3d0" text-anchor="middle">kgateway (Envoy) behind a new ALB</text><line x1="266" y1="135" x2="394" y2="135" stroke="#22c58b" stroke-width="3" marker-end="url(#a)"/><text x="330" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3fe3a6" text-anchor="middle">DNS switch</text><text x="360" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">1. Build the chart and the new ALB  ·  2. Run e2e tests against it  ·  3. Switch the real DNS</text><text x="360" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Done in four environments, with production last.</text></svg>